<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="music">
  <meta name="description" content="music — ad-free music player">
  <title>music</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://yt3.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="modulepreload" href="/js/main.js">
  <link rel="modulepreload" href="/js/ui.js">
  <link rel="modulepreload" href="/js/state.js">
  <link rel="modulepreload" href="/js/player.js">
  <link rel="modulepreload" href="/js/views.js">
</head>
<body class="root" data-tab="home">
  <div id="app">
    <aside class="sidebar">
      <div class="side-box">
        <a class="logo" href="#/"><img src="/icons/icon.svg" alt="">music</a>
        <nav class="side-nav">
          <a href="#/" data-tab="home"><i data-icon="home"></i><span>Home</span></a>
          <a href="#/search" data-tab="search"><i data-icon="search"></i><span>Search</span></a>
        </nav>
      </div>
      <div class="side-box side-lib-box">
        <div class="side-lib-head">
          <a href="#/library" data-tab="library"><i data-icon="library"></i><span>Your Library</span></a>
          <button id="side-create" class="icon-btn" aria-label="Create playlist" title="Create playlist"><i data-icon="plus"></i></button>
        </div>
        <div id="side-lib" class="side-lib"></div>
      </div>
    </aside>

    <main id="main">
      <div id="topbar">
        <button class="nav-btn" onclick="history.back()" aria-label="Back"><i data-icon="back"></i></button>
        <button class="nav-btn desk" onclick="history.forward()" aria-label="Forward"><i data-icon="fwd"></i></button>
        <span id="topbar-title"></span>
      </div>
      <div id="view"></div>
    </main>

    <aside id="queue" aria-label="Queue">
      <div class="queue-head"><h2>Queue</h2><button id="queue-close" class="icon-btn" aria-label="Close"><i data-icon="x"></i></button></div>
      <div id="queue-body" class="queue-body"></div>
    </aside>

    <footer id="player">
      <div class="pb-left">
        <div id="pb-art" class="pb-art" title="Now playing"></div>
        <div class="pb-text">
          <div id="pb-title" class="pb-title"></div>
          <div id="pb-artist" class="pb-artist"></div>
        </div>
        <button class="icon-btn pb-like" data-pl="like" aria-label="Like"></button>
        <button class="icon-btn mini-toggle" data-pl="toggle" aria-label="Play"></button>
      </div>
      <div class="pb-center">
        <div class="pb-controls">
          <button class="icon-btn sm mode" data-pl="shuffle" aria-label="Shuffle" title="Shuffle"><i data-icon="shuffle"></i></button>
          <button class="icon-btn" data-pl="prev" aria-label="Previous" title="Previous"><i data-icon="prev"></i></button>
          <button class="btn-toggle" data-pl="toggle" aria-label="Play"></button>
          <button class="icon-btn" data-pl="next" aria-label="Next" title="Next"><i data-icon="next"></i></button>
          <button class="icon-btn sm mode" data-pl="repeat" aria-label="Repeat" title="Repeat"></button>
        </div>
        <div class="pb-progress">
          <span data-pl="cur">0:00</span>
          <input type="range" class="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <span data-pl="dur">0:00</span>
        </div>
      </div>
      <div class="pb-right">
        <button class="icon-btn sm" data-pl="lyrics" aria-label="Lyrics" title="Lyrics"><i data-icon="lyrics"></i></button>
        <button class="icon-btn sm" data-pl="queue" aria-label="Queue" title="Queue (Q)"><i data-icon="queue"></i></button>
        <button class="icon-btn sm" id="mute" aria-label="Mute"></button>
        <input type="range" id="volume" class="range" min="0" max="100" value="100" aria-label="Volume">
        <button class="icon-btn sm" data-pl="open" aria-label="Now playing view" title="Now playing"><i data-icon="expand"></i></button>
      </div>
      <div class="mini-progress"><i id="mini-progress"></i></div>
    </footer>
  </div>

  <nav class="tabbar">
    <a href="#/" data-tab="home"><i data-icon="home"></i><span>Home</span></a>
    <a href="#/search" data-tab="search"><i data-icon="search"></i><span>Search</span></a>
    <a href="#/library" data-tab="library"><i data-icon="library"></i><span>Your Library</span></a>
  </nav>

  <section id="now" aria-label="Now playing">
    <div id="np-bg" class="np-bg"></div>
    <div class="np-inner">
      <header class="np-head">
        <button class="icon-btn" data-pl="close" aria-label="Close"><i data-icon="down"></i></button>
        <div class="np-head-text"><small>Playing from</small><button id="np-context" class="np-context"></button></div>
        <button class="icon-btn" data-pl="more" aria-label="More"><i data-icon="more"></i></button>
      </header>
      <div class="np-stage">
        <div id="np-art" class="np-art"></div>
        <div id="np-lyrics" class="np-lyrics"></div>
      </div>
      <div class="np-bottom">
        <div class="np-meta">
          <div class="np-text"><h2 id="np-title"></h2><div id="np-artist" class="np-artist"></div></div>
          <button class="icon-btn lg" data-pl="like" aria-label="Like"></button>
        </div>
        <div class="np-progress">
          <input type="range" class="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
          <div class="np-times"><span data-pl="cur">0:00</span><span data-pl="dur">0:00</span></div>
        </div>
        <div class="np-controls">
          <button class="icon-btn mode" data-pl="shuffle" aria-label="Shuffle"><i data-icon="shuffle"></i></button>
          <button class="icon-btn xl" data-pl="prev" aria-label="Previous"><i data-icon="prev"></i></button>
          <button class="btn-toggle big" data-pl="toggle" aria-label="Play"></button>
          <button class="icon-btn xl" data-pl="next" aria-label="Next"><i data-icon="next"></i></button>
          <button class="icon-btn mode" data-pl="repeat" aria-label="Repeat"></button>
        </div>
        <div class="np-actions">
          <button class="icon-btn" id="np-dl" data-pl="dl" aria-label="Download"></button>
          <button class="icon-btn" data-pl="lyrics" aria-label="Lyrics"><i data-icon="lyrics"></i></button>
          <button class="icon-btn" data-pl="queue" aria-label="Queue"><i data-icon="queue"></i></button>
        </div>
      </div>
    </div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <div class="offline-pill">Offline</div>
  <audio id="audio" preload="auto" playsinline></audio>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
