name: Release

# Push a tag like v1.0.0 to build every platform and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.MUSIC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MUSIC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --release
        env:
          MUSIC_KEYSTORE_PASSWORD: ${{ secrets.MUSIC_KEYSTORE_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk ../music-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: music-android.apk }

  linux:
    # oldest supported Ubuntu, so the AppImage runs on older distros too
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev file apt-utils
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build linux --release
      - run: sh packaging/linux/build-appimage.sh "${GITHUB_REF_NAME#v}" ../dist
      - run: sh packaging/linux/build-deb.sh "$(echo "${GITHUB_REF_NAME#v}" | sed 's/^build-//; s/^[^0-9]*$/0.0.0/')" ../dist
      # The release doubles as an apt repository (see site/install.sh); its index must be signed.
      - name: Sign apt index
        env: { APT_SIGNING_KEY: "${{ secrets.APT_SIGNING_KEY }}" }
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::warning::APT_SIGNING_KEY is not set; no apt repository this time"
            [ "$GITHUB_REF_TYPE" != tag ] || exit 1
            exit 0
          fi
          echo "$APT_SIGNING_KEY" | gpg --batch --import
          sh packaging/linux/apt-repo.sh ../dist
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build windows --release
      - name: Installer
        shell: pwsh
        run: |
          $rel = "$PWD\build\windows\x64\runner\Release"
          # the Microsoft C++ runtime, so it also runs on PCs that don't have it
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $rel
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          if (-not ($version -match '^\d')) { $version = '0.0.0' }
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$rel" "/O$PWD\.." packaging\windows\music.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: music-windows-setup.exe }

  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build macos --release
      - name: Disk image
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/music.app dmg/
          ln -s /Applications dmg/Applications
          codesign --force --deep --sign - dmg/music.app
          hdiutil create -volname music -srcfolder dmg -ov -format UDZO ../music-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: music-macos.dmg }

  release:
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "music $TAG" \
            --notes "Downloads for Android, Windows, macOS and Linux. See https://v3ai.github.io/music/ for install steps." \
            $([ "$GITHUB_REF_TYPE" = tag ] || echo --prerelease)

  # Install from the published apt repository on clean machines and make sure the app starts.
  check-apt:
    if: github.ref_type == 'tag'
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, image: "" }
          - { os: ubuntu-latest, image: "debian:12" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image || null }}
    steps:
      - name: Install with the one-liner from the website
        run: |
          S=$(command -v sudo || true)
          command -v curl >/dev/null || { $S apt-get update && $S apt-get install -y curl ca-certificates; }
          curl -fsSL https://v3ai.github.io/music/install.sh | $S sh
          dpkg -s music | grep -E '^(Status|Version)'
          [ "$(dpkg-query -W -f='${Version}' music)" = "${GITHUB_REF_NAME#v}" ]
      - name: Starts and keeps running
        run: |
          S=$(command -v sudo || true)
          # no GPU here: Mesa's software renderer stands in for a real desktop's driver
          $S apt-get install -y xvfb xauth libgl1-mesa-dri >/dev/null
          set +e
          timeout 20 xvfb-run -a music > out.log 2>&1
          code=$?
          cat out.log
          [ $code -eq 124 ] || { echo "music exited early (code $code)"; exit 1; }
      - name: AppImage starts too
        if: matrix.image == ''
        run: |
          curl -fsSL -o music.AppImage "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/music-linux-x86_64.AppImage"
          chmod +x music.AppImage
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a ./music.AppImage > app.log 2>&1
          code=$?
          cat app.log
          [ $code -eq 124 ] || { echo "AppImage exited early (code $code)"; exit 1; }
