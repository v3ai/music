name: Release

# Push a tag like v1.0.0 to build every platform and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.MUSIC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MUSIC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --release
        env:
          MUSIC_KEYSTORE_PASSWORD: ${{ secrets.MUSIC_KEYSTORE_PASSWORD }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk ../music-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: music-android.apk }

  linux:
    # oldest supported Ubuntu, so the AppImage runs on older distros too
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev file
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build linux --release
      - run: sh packaging/linux/build-appimage.sh "${GITHUB_REF_NAME#v}" ..
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: music-linux-x86_64.AppImage }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build windows --release
      - name: Installer
        shell: pwsh
        run: |
          $rel = "$PWD\build\windows\x64\runner\Release"
          # the Microsoft C++ runtime, so it also runs on PCs that don't have it
          foreach ($dll in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $rel
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          if (-not ($version -match '^\d')) { $version = '0.0.0' }
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$rel" "/O$PWD\.." packaging\windows\music.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: music-windows-setup.exe }

  macos:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build macos --release
      - name: Disk image
        run: |
          mkdir -p dmg
          cp -R build/macos/Build/Products/Release/music.app dmg/
          ln -s /Applications dmg/Applications
          codesign --force --deep --sign - dmg/music.app
          hdiutil create -volname music -srcfolder dmg -ov -format UDZO ../music-macos.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: music-macos.dmg }

  release:
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "music $TAG" \
            --notes "Downloads for Android, Windows, macOS and Linux. See https://v3ai.github.io/music/ for install steps." \
            $([ "$GITHUB_REF_TYPE" = tag ] || echo --prerelease)
